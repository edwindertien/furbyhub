<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f93a8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35d07f"/></marker></defs><rect width="100%" height="100%" fill="#0b0f14"/><text x="550" y="30" font-size="15" fill="#e8f0fb" text-anchor="middle" font-weight="600">Wire protocol (as implemented from the original Mega sketch)</text><text x="30" y="70" font-size="13" fill="#4aa3ff" text-anchor="start" font-weight="700">A  Wake  -  fake the tilt sensor</text><path d="M60 128 H150 V96 H430 V128 H760" stroke="#f0b040" stroke-width="3" fill="none"/><path d="M430 128 H760" stroke="#7f93a8" stroke-width="2" fill="none" stroke-dasharray="4 5"/><text x="300" y="88" font-size="12" fill="#e8f0fb" text-anchor="middle" font-weight="400">HIGH 100 ms  (wake_ms)</text><text x="595" y="120" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">floating (high-Z) ≥ 50 ms, then the next action</text><text x="60" y="150" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">The wire is only driven while talking; otherwise it is a floating input, like the original pinMode(INPUT).</text><text x="30" y="190" font-size="13" fill="#4aa3ff" text-anchor="start" font-weight="700">B  One packet = 9 bits  (here code 5, "dance")</text><rect x="60" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="114" y="224" font-size="11.5" fill="#e8f0fb" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">start = 1</text><rect x="172" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="226" y="224" font-size="11.5" fill="#e8f0fb" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">d0 = 1</text><rect x="284" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="338" y="224" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">d1 = 0</text><rect x="396" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="450" y="224" font-size="11.5" fill="#e8f0fb" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">d2 = 1</text><rect x="508" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="562" y="224" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">d3 = 0</text><rect x="620" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="674" y="224" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">~d0 = 0</text><rect x="732" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="786" y="224" font-size="11.5" fill="#e8f0fb" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">~d1 = 1</text><rect x="844" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="898" y="224" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">~d2 = 0</text><rect x="956" y="206" width="108" height="26" rx="6" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="1010" y="224" font-size="11.5" fill="#e8f0fb" text-anchor="middle" font-weight="400" font-family="ui-monospace,Menlo,Consolas,monospace">~d3 = 1</text><path d="M60 292 H60 V250 H76 V292 H116 V250 H132 V292 H172 V250 H188 V292 H228 V250 H244 V292 H284 V250 H300 V292 H396 V250 H412 V292 H452 V250 H468 V292 H508 V250 H524 V292 H620 V250 H636 V292 H732 V250 H748 V292 H788 V250 H804 V292 H844 V250 H860 V292 H956 V250 H972 V292 H1012 V250 H1028 V292 H1068" stroke="#f0b040" stroke-width="2.5" fill="none"/><line x1="60" y1="240" x2="60" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="116" y1="240" x2="116" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="172" y1="240" x2="172" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="228" y1="240" x2="228" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="284" y1="240" x2="284" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="340" y1="240" x2="340" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="396" y1="240" x2="396" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="452" y1="240" x2="452" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="508" y1="240" x2="508" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="564" y1="240" x2="564" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="620" y1="240" x2="620" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="676" y1="240" x2="676" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="732" y1="240" x2="732" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="788" y1="240" x2="788" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="844" y1="240" x2="844" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="900" y1="240" x2="900" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="956" y1="240" x2="956" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="1012" y1="240" x2="1012" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><line x1="1068" y1="240" x2="1068" y2="300" stroke="#2a3441" stroke-width="1" stroke-dasharray="2 4"/><text x="60" y="322" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">150 µs pulses on a 1050 µs grid.  First half-slot: always a pulse.  Second half-slot: a pulse only if the bit is 1.</text><text x="60" y="340" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">Data bits go LSB first; the next four bits are the same four bits inverted. Every packet has 14 pulses.</text><text x="30" y="388" font-size="13" fill="#4aa3ff" text-anchor="start" font-weight="700">C  A message repeats 6 times, ~109 ms apart</text><rect x="60" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="90" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="120" y1="419" x2="220" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="170" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><rect x="220" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="250" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="280" y1="419" x2="380" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="330" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><rect x="380" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="410" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="440" y1="419" x2="540" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="490" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><rect x="540" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="570" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="600" y1="419" x2="700" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="650" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><rect x="700" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="730" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="760" y1="419" x2="860" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="810" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><rect x="860" y="404" width="60" height="30" rx="6" fill="#3a3014" stroke="#ffb454" stroke-width="1.2"/><text x="890" y="424" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="400">packet</text><line x1="920" y1="419" x2="1020" y2="419" stroke="#7f93a8" stroke-width="1.5" stroke-dasharray="3 4"/><text x="970" y="412" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">90 ms</text><text x="60" y="462" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">sleep = message 15, wait 800 ms, message 15 again (a Furby that is busy ignores packets, so it is sent twice).</text><text x="60" y="484" font-size="11.5" fill="#ffb454" text-anchor="start" font-weight="400">The 9-bit structure comes from the working sketch and has NOT been independently confirmed. Every timing is tunable: timing pulse|half|repeats|gap|wake.</text></svg>