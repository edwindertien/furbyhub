ght="600" font-family="ui-monospace,Menlo,Consolas,monospace">Standalone</text><text x="298" y="328" font-size="11" fill="#7f93a8" text-anchor="start" font-weight="400">idle / waking / awake / sleeping</text><rect x="510" y="278" width="208" height="68" rx="12" fill="#151b23" stroke="#2a3441" stroke-width="1.2"/><text x="524" y="306" font-size="14" fill="#e8f0fb" text-anchor="start" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">Settings</text><text x="524" y="328" font-size="11" fill="#7f93a8" text-anchor="start" font-weight="400">furbyhub.json  &lt;-&gt;  RAM struct</text><rect x="284" y="366" width="432" height="66" rx="12" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="300" y="392" font-size="13" fill="#e8f0fb" text-anchor="start" font-weight="600" font-family="ui-monospace,Menlo,Consolas,monospace">Diag</text><text x="300" y="414" font-size="11" fill="#7f93a8" text-anchor="start" font-weight="400">live log, breadcrumbs that survive a watchdog reset, subsystem switches</text><rect x="284" y="444" width="432" height="62" rx="12" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="300" y="470" font-size="13" fill="#e8f0fb" text-anchor="start" font-weight="600">Watchdog 8 s</text><text x="300" y="490" font-size="11" fill="#7f93a8" text-anchor="start" font-weight="400">core 0 reboots if it ever stops looping</text><rect x="756" y="230" width="70" height="130" rx="12" fill="#1a2430" stroke="#b58cff" stroke-width="1.2"/><text x="791" y="282" font-size="12" fill="#b58cff" text-anchor="middle" font-weight="600">queue</text><text x="791" y="300" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">64 actions</text><text x="791" y="316" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">lock-free</text><line x1="740" y1="295" x2="756" y2="295" stroke="#b58cff" stroke-width="2.5" marker-end="url(#ar)"/><line x1="826" y1="295" x2="850" y2="295" stroke="#b58cff" stroke-width="2.5" marker-end=