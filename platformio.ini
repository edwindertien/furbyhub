; reFurbyshment - distributed furby controller unit
; Board: Raspberry Pi Pico W on a Waveshare Pico-Servo-Driver
; Core:  earlephilhower arduino-pico (same platform fork as picoControl-wifi)
;
; One binary serves all five units: the unit number (1..99) lives in
; furbyhub.json on the LittleFS partition (set with `config set hub.id <n>`).

[env:picow]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
board            = rpipicow
board_build.core = earlephilhower
framework        = arduino

; 2 MB flash: ~0.4 MB firmware, 0.5 MB LittleFS for furbyhub.json
board_build.filesystem      = littlefs
board_build.filesystem_size = 0.5m

lib_deps         =
    https://github.com/bblanchon/ArduinoJson.git#v7.2.1

monitor_speed    = 115200
monitor_filters  = send_on_enter
monitor_eol      = LF

build_flags      =
    -O2
