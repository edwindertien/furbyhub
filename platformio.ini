; reFurbyshment - distributed furby controller unit
; Board: Raspberry Pi Pico W on a Waveshare Pico-Servo-Driver
; Core:  earlephilhower arduino-pico (same platform fork as picoControl-wifi)
;
; One binary serves all five units: the unit number (1..99) is stored in
; flash and set from the CLI with `unit <n>`.

[env:picow]
platform         = https://github.com/maxgerhardt/platform-raspberrypi.git
board            = rpipicow
board_build.core = earlephilhower
framework        = arduino

monitor_speed    = 115200
monitor_filters  = send_on_enter
monitor_eol      = LF

; The pulse engine needs to be fast and predictable
build_flags      =
    -O2
