<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f93a8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35d07f"/></marker></defs><rect width="100%" height="100%" fill="#0b0f14"/><text x="550" y="30" font-size="15" fill="#e8f0fb" text-anchor="middle" font-weight="600">Standalone behaviour of one hub</text><rect x="30" y="90" width="160" height="92" rx="16" fill="#151b23" stroke="#7f93a8" stroke-width="2"/><text x="110" y="128" font-size="18" fill="#e8f0fb" text-anchor="middle" font-weight="700">Idle</text><text x="110" y="154" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">furbies quiet</text><rect x="330" y="90" width="160" height="92" rx="16" fill="#151b23" stroke="#4aa3ff" stroke-width="2"/><text x="410" y="128" font-size="18" fill="#e8f0fb" text-anchor="middle" font-weight="700">Waking</text><text x="410" y="154" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">one by one, 300 ms apart</text><rect x="630" y="90" width="160" height="92" rx="16" fill="#151b23" stroke="#35d07f" stroke-width="2"/><text x="710" y="128" font-size="18" fill="#e8f0fb" text-anchor="middle" font-weight="700">Awake</text><text x="710" y="154" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">chatter every 6-20 s</text><rect x="930" y="90" width="160" height="92" rx="16" fill="#151b23" stroke="#b58cff" stroke-width="2"/><text x="1010" y="128" font-size="18" fill="#e8f0fb" text-anchor="middle" font-weight="700">Sleeping</text><text x="1010" y="154" font-size="10" fill="#7f93a8" text-anchor="middle" font-weight="400">sleep sent twice, 150 ms apart</text><line x1="198" y1="136" x2="322" y2="136" stroke="#e8f0fb" stroke-width="2" marker-end="url(#ar)"/><text x="260" y="160" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">sensor sees someone,</text><text x="260" y="174" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">button, or</text><text x="260" y="188" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">"Wake everyone"</text><line x1="498" y1="136" x2="622" y2="136" stroke="#e8f0fb" stroke-width="2" marker-end="url(#ar)"/><text x="560" y="160" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">all furbies woken</text><line x1="798" y1="136" x2="922" y2="136" stroke="#e8f0fb" stroke-width="2" marker-end="url(#ar)"/><text x="860" y="160" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">awake_s (60 s) after</text><text x="860" y="174" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">the last movement</text><path d="M1010 182 V236 H110 V186" stroke="#b58cff" stroke-width="2" fill="none" marker-end="url(#ar)"/><text x="560" y="256" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">every furby asleep  -&gt;  cooldown 3 s  -&gt;  idle again</text><rect x="30" y="290" width="1040" height="92" rx="14" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="50" y="318" font-size="13" fill="#35d07f" text-anchor="start" font-weight="700">auto = on</text><text x="150" y="318" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">the sensor triggers, a present person keeps the furbies awake, the timeout puts them to sleep, they chatter at random.</text><text x="50" y="344" font-size="13" fill="#ffb454" text-anchor="start" font-weight="700">auto = off</text><text x="150" y="344" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">nothing happens by itself: no sensor reaction, no timeout, no chatter.</text><text x="50" y="370" font-size="13" fill="#4aa3ff" text-anchor="start" font-weight="700">always</text><text x="150" y="370" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">the button and every dashboard, CLI and OSC command work in both modes.</text></svg>