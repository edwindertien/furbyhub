<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f93a8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35d07f"/></marker></defs><rect width="100%" height="100%" fill="#0b0f14"/><text x="550" y="30" font-size="15" fill="#e8f0fb" text-anchor="middle" font-weight="600">One hub: two cores, one queue, one JSON file</text><rect x="24" y="70" width="190" height="84" rx="14" fill="#151b23" stroke="#4aa3ff" stroke-width="1.2"/><text x="119" y="106" font-size="14" fill="#e8f0fb" text-anchor="middle" font-weight="600">USB serial</text><text x="119" y="128" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">CLI, 115200 baud</text><rect x="24" y="188" width="190" height="84" rx="14" fill="#151b23" stroke="#4aa3ff" stroke-width="1.2"/><text x="119" y="224" font-size="14" fill="#e8f0fb" text-anchor="middle" font-weight="600">WiFi radio (CYW43)</text><text x="119" y="246" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">own AP or router client</text><rect x="24" y="306" width="190" height="84" rx="14" fill="#151b23" stroke="#ffb454" stroke-width="1.2"/><text x="119" y="342" font-size="14" fill="#e8f0fb" text-anchor="middle" font-weight="600">LittleFS</text><text x="119" y="364" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">/furbyhub.json</text><rect x="24" y="424" width="190" height="84" rx="14" fill="#151b23" stroke="#35d07f" stroke-width="1.2"/><text x="119" y="460" font-size="14" fill="#e8f0fb" text-anchor="middle" font-weight="600">Sensor + button</text><text x="119" y="482" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="40