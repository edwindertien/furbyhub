<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" font-family="system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f93a8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#35d07f"/></marker></defs><rect width="100%" height="100%" fill="#0b0f14"/><text x="550" y="30" font-size="15" fill="#e8f0fb" text-anchor="middle" font-weight="600">Wiring: one wire per Furby (plus power and ground)</text><rect x="24" y="60" width="330" height="290" rx="16" fill="#151b23" stroke="#4aa3ff" stroke-width="1.2"/><text x="189" y="90" font-size="13.5" fill="#e8f0fb" text-anchor="middle" font-weight="600">Pico W on Waveshare Pico-Servo-Driver</text><rect x="48" y="110" width="282" height="76" rx="10" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="189" y="138" font-size="13" fill="#e8f0fb" text-anchor="middle" font-weight="400">Pico W (RP2040 + CYW43)</text><text x="189" y="160" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">USB: power, CLI, firmware</text><rect x="48.0" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="63.5" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">1</text><text x="63.5" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="83.5" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="99.0" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">2</text><text x="99.0" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="119.0" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="134.5" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">3</text><text x="134.5" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="154.5" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="170.0" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">4</text><text x="170.0" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="190.0" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="205.5" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">5</text><text x="205.5" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="225.5" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="241.0" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">6</text><text x="241.0" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="261.0" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="276.5" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">7</text><text x="276.5" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="296.5" y="204" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="312.0" y="226" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">8</text><text x="312.0" y="247" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="48.0" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="63.5" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">9</text><text x="63.5" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="83.5" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="99.0" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">10</text><text x="99.0" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="119.0" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="134.5" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">11</text><text x="134.5" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="154.5" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="170.0" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">12</text><text x="170.0" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="190.0" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="205.5" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">13</text><text x="205.5" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="225.5" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="241.0" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">14</text><text x="241.0" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="261.0" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="276.5" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">15</text><text x="276.5" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><rect x="296.5" y="248" width="31" height="36" rx="6" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="312.0" y="270" font-size="11" fill="#e8f0fb" text-anchor="middle" font-weight="600">16</text><text x="312.0" y="291" font-size="8" fill="#7f93a8" text-anchor="middle" font-weight="400"></text><text x="189" y="312" font-size="12" fill="#7f93a8" text-anchor="middle" font-weight="400">servo ports 1-16  =  GP0 … GP15</text><text x="189" y="332" font-size="10.5" fill="#7f93a8" text-anchor="middle" font-weight="400">(signal pin = GPIO, middle = V+, outer = GND)</text><text x="430" y="120" font-size="12" fill="#e8f0fb" text-anchor="middle" font-weight="600">standard 3-wire servo lead</text><line x1="354" y1="150" x2="540" y2="150" stroke="#f0b040" stroke-width="6"/><text x="447" y="140" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">signal</text><line x1="354" y1="190" x2="540" y2="190" stroke="#d6302a" stroke-width="6"/><text x="447" y="180" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">V+</text><line x1="354" y1="230" x2="540" y2="230" stroke="#6b4a3a" stroke-width="6"/><text x="447" y="220" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">GND</text><rect x="540" y="60" width="536" height="290" rx="16" fill="#151b23" stroke="#35d07f" stroke-width="1.2"/><text x="808" y="90" font-size="13.5" fill="#e8f0fb" text-anchor="middle" font-weight="600">inside the Furby (the original "hack")</text><text x="556" y="176" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">battery +  (6 V)</text><text x="556" y="216" font-size="11.5" fill="#7f93a8" text-anchor="start" font-weight="400">battery -</text><rect x="900" y="120" width="150" height="40" rx="10" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="975" y="145" font-size="12" fill="#e8f0fb" text-anchor="middle" font-weight="400">IR receiver output</text><rect x="900" y="196" width="150" height="40" rx="10" fill="#10161d" stroke="#2a3441" stroke-width="1.2"/><text x="975" y="221" font-size="12" fill="#e8f0fb" text-anchor="middle" font-weight="400">tilt sensor  node</text><line x1="540" y1="150" x2="800" y2="150" stroke="#f0b040" stroke-width="5"/><path d="M800 150 L800 140 L820 140" stroke="#7f93a8" stroke-width="0" fill="none"/><path d="M800 150 L800 140" stroke="#7f93a8" stroke-width="1" fill="none"/><line x1="800" y1="150" x2="800" y2="216" stroke="#f0b040" stroke-width="3"/><line x1="800" y1="140" x2="826" y2="140" stroke="#f0b040" stroke-width="3"/><line x1="800" y1="216" x2="826" y2="216" stroke="#f0b040" stroke-width="3"/><rect x="826" y="131" width="56" height="18" rx="4" fill="#2a2417" stroke="#ffb454" stroke-width="1.2"/><text x="854" y="144" font-size="11" fill="#ffb454" text-anchor="middle" font-weight="400">10 k</text><line x1="882" y1="140" x2="900" y2="140" stroke="#f0b040" stroke-width="3"/><rect x="826" y="207" width="56" height="18" rx="4" fill="#2a2417" stroke="#ffb454" stroke-width="1.2"/><text x="854" y="220" font-size="11" fill="#ffb454" text-anchor="middle" font-weight="400">10 k</text><line x1="882" y1="216" x2="900" y2="216" stroke="#f0b040" stroke-width="3"/><text x="808" y="274" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">signal wire  →  10 k  →  IR receiver input</text><text x="808" y="292" font-size="11.5" fill="#7f93a8" text-anchor="middle" font-weight="400">signal wire  →  10 k  →  tilt input</text><text x="808" y="320" font-size="11.5" fill="#35d07f" text-anchor="middle" font-weight="400">long HIGH pulse + float = wakes it · short pulses = the IR protocol</text><rect x="24" y="372" width="520" height="216" rx="16" fill="#10161d" stroke="#ffb454" stroke-width="1.2"/><text x="44" y="400" font-size="13.5" fill="#ffb454" text-anchor="start" font-weight="700">Power  -  read before connecting 6 V</text><text x="44" y="428" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">The servo rail is the output of the board's 5 V buck regulator,</text><text x="44" y="450" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">and the Pico's VSYS shares it. 6 V into the VIN terminal gives ~5 V.</text><text x="44" y="472" font-size="12" fill="#e8f0fb" text-anchor="start" font-weight="400">Do NOT put 6 V on the rail pins while the regulator is attached.</text><text x="44" y="494" font-size="12" fill="#7f93a8" text-anchor="start" font-weight="400">1) Try one Furby at 5 V first.</text><text x="44" y="516" font-size="12" fill="#7f93a8" text-anchor="start" font-weight="400">2) If it needs 6 V: separate 6 V bus, COMMON GROUND with the board,</text><text x="44" y="538" font-size="12" fill="#7f93a8" text-anchor="start" font-weight="400">   board = signal + GND only (de-pin the red wire at the board end).</text><text x="44" y="560" font-size="12" fill="#7f93a8" text-anchor="start" font-weight="400">Measure first: derived from the schematic netlist, not verified on the board.</text><rect x="560" y="372" width="516" height="216" rx="16" fill="#10161d" stroke="#35d07f" stroke-width="1.2"/><text x="580" y="400" font-size="13.5" fill="#35d07f" text-anchor="start" font-weight="700">Hub inputs (free Pico pins)</text><text x="580" y="430" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">GP22</text><text x="662" y="430" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">PIR sensor out (sensor.type = pir), active high</text><text x="580" y="456" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">GP20</text><text x="662" y="456" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">HC-SR04 trigger (sensor.type = hcsr04)</text><text x="580" y="482" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">GP19</text><text x="662" y="482" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">HC-SR04 echo  -  3.3 V ONLY (divider for 5 V modules)</text><text x="580" y="508" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">GP21</text><text x="662" y="508" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">button to GND: wake/sleep, 3 s at boot = network reset</text><text x="580" y="534" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">GP23-25,29</text><text x="662" y="534" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">used by the WiFi chip, never touch</text><text x="580" y="560" font-size="12" fill="#ffb454" text-anchor="start" font-weight="700" font-family="ui-monospace,Menlo,Consolas,monospace">I²C</text><text x="662" y="560" font-size="11.5" fill="#e8f0fb" text-anchor="start" font-weight="400">NOT on GP4/GP5 (= Furby 5 and 6): use I²C1 on GP26/GP27</text></svg>